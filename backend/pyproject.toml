[project]
name = "agentshield"
version = "1.0.0"
description = "Local security proxy for coding-agent traffic"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "click>=8.1.7",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "keyring>=24.3.0",
    "presidio-analyzer>=2.2.364",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
agentshield = "agentshield.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[dependency-groups]
dev = [
    "cyclonedx-bom>=7.4.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C90", "B", "UP", "N", "ASYNC", "S", "RET", "SIM", "PTH", "RUF"
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108"]
"migrations/*" = ["E501"]
"src/agentshield/filtering/models.py" = ["S105"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUntypedFunctionDecorator = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow benchmark or latency-sensitive tests",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
    "ignore::starlette.exceptions.StarletteDeprecationWarning:starlette.testclient",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
