name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Lint and Format check (Ruff)
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (Pyright)
        run: |
          cd backend
          uv run pyright

      - name: Run Pytest
        run: |
          cd backend
          uv run pytest -v

  frontend:
    name: Frontend Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (for Playwright backend server)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: |
          cd frontend
          pnpm lint

      - name: Type check (TypeScript)
        run: |
          cd frontend
          pnpm typecheck

      - name: Unit tests (Vitest)
        run: |
          cd frontend
          pnpm test

      - name: Build frontend bundle
        run: |
          cd frontend
          pnpm build

      - name: Install Playwright Browsers
        run: |
          cd frontend
          pnpm exec playwright install --with-deps chromium

      - name: Playwright Smoke Test
        run: |
          cd frontend
          pnpm exec playwright test

  security:
    name: Supply Chain Security & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies (with dev tools)
        run: |
          cd backend
          uv sync --frozen

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run dependency vulnerability scans
        run: ./scripts/scan_dependencies.sh

      - name: Generate CycloneDX SBOMs
        run: ./scripts/generate_sbom.sh

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sboms
          path: dist/sbom/

