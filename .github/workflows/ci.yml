name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f94e4d41285223c72a8cb9ba0c4e73b2241b7161 # v5.3.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Lint and Format check (Ruff)
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (Pyright)
        run: |
          cd backend
          uv run pyright

      - name: Run Pytest
        run: |
          cd backend
          uv run pytest -v

  frontend:
    name: Frontend Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv (for Playwright backend server)
        uses: astral-sh/setup-uv@f94e4d41285223c72a8cb9ba0c4e73b2241b7161 # v5.3.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832e0b1 # v4.0.3
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: |
          cd frontend
          pnpm lint

      - name: Type check (TypeScript)
        run: |
          cd frontend
          pnpm typecheck

      - name: Unit tests (Vitest)
        run: |
          cd frontend
          pnpm test

      - name: Build frontend bundle
        run: |
          cd frontend
          pnpm build

      - name: Install Playwright Browsers
        run: |
          cd frontend
          pnpm exec playwright install --with-deps chromium

      - name: Playwright Smoke Test
        run: |
          cd frontend
          pnpm exec playwright test

  security:
    name: Supply Chain Security & SBOM
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f94e4d41285223c72a8cb9ba0c4e73b2241b7161 # v5.3.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v4.1.0
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832e0b1 # v4.0.3
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies (with dev tools)
        run: |
          cd backend
          uv sync --frozen

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run dependency vulnerability scans
        run: ./scripts/scan_dependencies.sh

      - name: Generate CycloneDX SBOMs
        run: ./scripts/generate_sbom.sh

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8afd # v4.6.1
        with:
          name: cyclonedx-sboms
          path: dist/sbom/
          retention-days: 90
